name: zipcodes

services:
  zipcodes:
    image: ghcr.io/apimgr/zipcodes:latest
    container_name: zipcodes
    restart: unless-stopped
    environment:
      # Hardcoded with sane defaults - NO .env files
      - MODE=production
      - TZ=America/New_York
      # ENABLE_TOR=true is default, no need to specify
    ports:
      # Production: bound to Docker bridge only
      - "172.17.0.1:64580:80"
    volumes:
      - ./rootfs/config/zipcodes:/config
      - ./rootfs/data/zipcodes:/data
    networks:
      - zipcodes

networks:
  zipcodes:
    name: zipcodes
    external: false
