name: zipcodes

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  zipcodes:
    image: ghcr.io/apimgr/zipcodes:latest
    container_name: zipcodes-app
    hostname: zipcodes
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      ADDRESS: 0.0.0.0
      CONFIG_DIR: /config/zipcodes
      DATA_DIR: /data/zipcodes
      LOGS_DIR: /data/log/zipcodes
      PORT: 80
      TZ: America/New_York
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64580:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/zipcodes", "--port", "80", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - zipcodes

networks:
  zipcodes:
    name: zipcodes
    external: false
